<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asociacion Ciguena</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f7f9fb;
      --surface: #ffffff;
      --text: #172033;
      --muted: #5f6f86;
      --accent: #1c6ea4;
      --border: #d9e2ec;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 20px;
    }

    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 28px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      line-height: 1.2;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    a {
      color: var(--accent);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Asociacion Ciguena</h1>
      <p>Documentacion legal y enlaces publicos de la aplicacion.</p>
      <a href="./privacy-policy.html">Ver politica de privacidad</a>
    </section>
  </main>
</body>
</html>
