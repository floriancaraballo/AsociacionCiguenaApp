# ========================================
# PROJECT PROPERTIES
# ========================================
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# ========================================
# KOTLIN
# ========================================
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true

# ========================================
# ANDROID
# ========================================
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# ========================================
# COMPOSE
# ========================================
# Habilita métricas de Compose (opcional, para debugging)
# androidx.compose.compiler.metricsDestination=build/compose_metrics
# androidx.compose.compiler.reportsDestination=build/compose_reports

# ========================================
# SECURITY
# ========================================
# NO pongas aquí información sensible como API keys
# Usa local.properties o variables de entorno